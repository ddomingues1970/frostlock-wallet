[workspace]
members = [
    "crates/wallet-core",
    "crates/wallet-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
bdk_wallet = { version = "=3.2.0", features = ["all-keys", "rusqlite"] }
bitcoincore-rpc = "=0.19.0"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1.9", features = ["derive"] }
